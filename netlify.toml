[build]
  base = "engine"
  command = "npm run build"
  publish = "dist"
  # Cada deploy de produção custa créditos do plano grátis. Sem mudança no
  # site (só .md, migração do Supabase, ferramentas fora de engine/), pula o
  # build. Roda a partir da base (engine/); sai 0 = pular.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml ':(exclude,glob)**/*.md'"

# Funções de servidor: guardam as chaves dos gateways (que nunca podem ir pro
# navegador) e recebem os webhooks de pagamento.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Geolocalização por IP na borda (chute inicial de região p/ visitante).
# A pasta padrão das edge functions é <base>/netlify/edge-functions.
[[edge_functions]]
  path = "/api/geo"
  function = "geo"

# Cartão de pré-visualização (WhatsApp, Instagram, Facebook, Google) da página
# pública de cada anúncio. Só robô de pré-visualização paga a consulta ao
# banco; gente de verdade passa direto. Ver service-og.js.
[[edge_functions]]
  path = "/servicos/*"
  function = "service-og"

# A mesma função para a página pública do produto (Lojas).
[[edge_functions]]
  path = "/produtos/*"
  function = "service-og"

# Cartão de pré-visualização do que se compartilha da Comunidade: post,
# perfil e hashtag, página profissional, clube e evento. Mesmo critério do
# service-og: só robô consulta o banco, como visitante. Ver social-og.js.
[[edge_functions]]
  path = "/post/*"
  function = "social-og"

[[edge_functions]]
  path = "/community/*"
  function = "social-og"

[[edge_functions]]
  path = "/p/*"
  function = "social-og"

[[edge_functions]]
  path = "/carro/*"
  function = "social-og"

[[edge_functions]]
  path = "/clubs/*"
  function = "social-og"

[[edge_functions]]
  path = "/events/*"
  function = "social-og"

# Redirecionamento forçado do subdomínio Netlify para o domínio oficial
[[redirects]]
  from = "https://enginegarage.netlify.app/*"
  to = "https://enginegarage.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://enginegarage.netlify.app/*"
  to = "https://enginegarage.com.br/:splat"
  status = 301
  force = true


# O arquivo que descobre que existe versão nova não pode ser servido do cache.
#
# Por padrão o Netlify manda `max-age=14400` no sw.js: quatro horas em que a
# pergunta "tem versão nova?" pode ser respondida pela cópia velha, que por
# definição não sabe de nada. O navegador normalmente revalida o script do
# service worker por conta própria, mas isso depende de `updateViaCache` e da
# versão dele — e aqui não há nada a ganhar com o cache: é um arquivo de 5 kB
# que só é buscado quando o app já decidiu perguntar.
#
# O que está DENTRO dele continua com cache longo: workbox e os assets têm o
# hash do conteúdo no nome, então nome novo é arquivo novo.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Mesma razão: o registro aponta para cá, e o manifesto é o que o celular lê
# quando a pessoa instala o app na tela inicial.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
