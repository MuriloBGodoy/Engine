[build]
  base = "engine"
  command = "npm run build"
  publish = "dist"
  # Cada deploy de produção custa créditos do plano grátis. Sem mudança no
  # site (só .md, migração do Supabase, ferramentas fora de engine/), pula o
  # build. Roda a partir da base (engine/); sai 0 = pular.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml ':(exclude,glob)**/*.md'"

# Funções de servidor: guardam as chaves dos gateways (que nunca podem ir pro
# navegador) e recebem os webhooks de pagamento.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Geolocalização por IP na borda (chute inicial de região p/ visitante).
# A pasta padrão das edge functions é <base>/netlify/edge-functions.
[[edge_functions]]
  path = "/api/geo"
  function = "geo"

# Cartão de pré-visualização (WhatsApp, Instagram, Facebook, Google) da página
# pública de cada anúncio. Só robô de pré-visualização paga a consulta ao
# banco; gente de verdade passa direto. Ver service-og.js.
[[edge_functions]]
  path = "/servicos/*"
  function = "service-og"
