<!doctype html>
<!-- `class="dark"` já no HTML: o tema padrão é escuro e a classe só chegava
     depois do React montar, então todo carregamento pintava o fundo claro
     (#e9ebf0) por um instante antes de escurecer — no PWA, a splash preta
     abria num flash cinza. Medido em 13/09/2026 no WebKit: primeiro frame com
     class="" e fundo claro. Quem salvou tema claro continua sendo atendido:
     useThemeMode tira a classe assim que lê a preferência. -->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- O iOS ignora o manifest para o ícone e o título da tela de início. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Engine" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- `interactive-widget=resizes-content`: Chrome 108+ e Samsung Internet
         deixaram de encolher o layout quando o teclado abre; sem isto o 100dvh
         não acompanha e o rodapé fixo dos modais fica debaixo do teclado.
         Medido pela Mia em 16/09/2026 (Chromium, 360x740). O iOS ignora. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Uma só cor de status bar, sincronizada pelo script abaixo. Havia duas
         (uma por `prefers-color-scheme`), mas o tema do Engine é por classe,
         não pelo sistema: iPhone no modo claro do sistema com o app escuro
         ganhava barra do Safari em #f9fafb sobre uma tela #08090c. Medido em
         13/09/2026. A cor lida vem do `background-color` do :root, que é o
         token — nada cravado aqui. -->
    <meta name="theme-color" content="#08090c" />
    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        var sync = function () {
          var color = getComputedStyle(document.documentElement).backgroundColor;
          // Antes do CSS chegar o fundo é transparente; aí a cor anterior fica.
          if (color && color !== "rgba(0, 0, 0, 0)" && color !== "transparent") {
            meta.content = color;
          }
        };
        new MutationObserver(sync).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class", "data-theme"],
        });
        document.addEventListener("DOMContentLoaded", sync);
        window.addEventListener("load", sync);
        sync();
      })();
    </script>
    <meta
      name="description"
      content="Engine — organize sua garagem, acompanhe metas e conecte-se com a comunidade automotiva."
    />

    <!-- Cartão de link da PÁGINA INICIAL (17/11/2026).
         Post, perfil, carro, clube, evento e anúncio já ganhavam cartão pelas
         edge functions social-og e service-og. A raiz não tinha nenhum — e a
         raiz é exatamente o link que vai na bio do Instagram e no story:
         compartilhar enginegarage.com.br mostrava a URL crua, sem imagem,
         sem título e sem frase.
         Aqui é escrito à mão porque não depende de nada do banco; quando a
         rota é funda, as edge functions apagam estas tags antes de pôr as
         delas (ver TAGS_DA_RAIZ), senão sobrariam dois og:title e o raspador
         fica com o primeiro, que é este genérico.
         A imagem sai de `npm run og` (scripts/generate-og-image.mjs) e é
         versionada; o endereço precisa ser absoluto, porque quem lê o cartão
         não resolve caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Engine" />
    <meta property="og:title" content="Engine — sua garagem virou rede" />
    <meta
      property="og:description"
      content="Metas, custos, manutenção e a comunidade automotiva em um só lugar."
    />
    <meta property="og:url" content="https://enginegarage.com.br/" />
    <meta property="og:image" content="https://enginegarage.com.br/og-engine.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Engine — sua garagem virou rede" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engine — sua garagem virou rede" />
    <meta
      name="twitter:description"
      content="Metas, custos, manutenção e a comunidade automotiva em um só lugar."
    />
    <meta name="twitter:image" content="https://enginegarage.com.br/og-engine.png" />
    <link rel="canonical" href="https://enginegarage.com.br/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=Sora:wght@600;700;800&display=swap"
    />

    <!-- Endereço e chave PÚBLICA do Supabase, gravados pelo Vite no build. Quem
         lê é a edge function service-og (cartão de link de /servicos/*), que
         roda antes do JavaScript existir. A chave já vai no bundle; quem
         protege os dados é a RLS. -->
    <meta name="engine:supabase-url" content="%VITE_SUPABASE_URL%" />
    <meta name="engine:supabase-key" content="%VITE_SUPABASE_PUBLISHABLE_KEY%" />
    <!-- O que o Google mostra na lista de resultados e o que vira o nome
         da aba e do favorito. "Engine" sozinho nao diz o que o site e, e
         disputa a palavra com motor de busca, motor de jogo e afins. As
         telas que tem titulo proprio (paginas legais, produto publico)
         continuam trocando este valor ao abrir. -->
    <title>Engine — sua garagem virou rede</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
